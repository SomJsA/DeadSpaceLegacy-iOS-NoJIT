{
  "name": "Complete iOS no-JIT core",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "stage": {
          "description": "Apple-toolchain stage",
          "type": "choice",
          "required": true,
          "default": "integrated",
          "options": [
            "check",
            "device-library",
            "integrated",
            "simulator",
            "review-image"
          ]
        },
        "artifact_run": {
          "description": "Existing compiled artifact for validation-only review",
          "required": false,
          "type": "string",
          "default": "41614604627"
        }
      }
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "ios-native-nojit",
    "cancel-in-progress": false
  },
  "jobs": {
    "apple": {
      "runs-on": "${{ inputs.stage == 'review-image' && 'ubuntu-latest' || 'macos-15' }}",
      "timeout-minutes": 20,
      "steps": [
        {
          "uses": "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Fetch pinned public native dependencies",
          "run": "python3 tools/ios-ci/fetch-public.py",
          "if": "${{ inputs.stage != 'review-image' }}"
        },
        {
          "name": "Install build tools",
          "run": "command -v cmake >/dev/null || brew install cmake\ncommand -v ninja >/dev/null || brew install ninja\nrustup toolchain install 1.99.0 --profile minimal\nrustup default 1.99.0\nrustup target add aarch64-apple-ios aarch64-apple-ios-sim",
          "if": "${{ inputs.stage != 'review-image' }}"
        },
        {
          "name": "Core tests and complete iOS build",
          "env": {
            "BUILD_STAGE": "${{ inputs.stage }}"
          },
          "run": "python3 tools/ios-ci/build.py --stage \"$BUILD_STAGE\"",
          "if": "${{ inputs.stage != 'review-image' }}"
        },
        {
          "name": "Validate existing native artifact without Mac rebuild",
          "if": "${{ inputs.stage == 'review-image' }}",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "NATIVE_ARTIFACT_RUN": "${{ inputs.artifact_run }}"
          },
          "run": "python3 -m venv .qa-venv\n.qa-venv/bin/python -m pip install --quiet Pillow==12.0.0\n.qa-venv/bin/python tools/ios-ci/review_existing.py"
        },
        {
          "name": "Keep build evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "apple-nojit-build-evidence",
            "path": "apple-build-results/*.log\napple-build-results/*.json\napple-build-results/*.ipa\napple-build-results/*.png\napple-build-results/*.ips\napple-build-results/*.txt\napple-build-results/*.zip",
            "retention-days": 3,
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}
